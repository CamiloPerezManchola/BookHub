<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(
    'Explore Books | BookHub',
    'Explore books, authors and recommendations.'
)}">
</head>
<body>

  <!-- Header Fragment -->
  <div th:replace="~{fragments/header :: header}"></div>

  <div class="explore-layout container">
    <!-- Sidebar / Top Filter Bar on Mobile -->
    <aside class="filter-sidebar">
      <div class="filter-header">
        <h2>Filters</h2>
      </div>

      <form id="filterForm" class="filter-form">
        <!-- Publication Year Filter -->
        <div class="range-inputs">
            <input type="number"
                  id="yearFrom"
                  placeholder="From (e.g. 1990)"
                  min="1800"
                  max="2026">

            <span>to</span>

            <input type="number"
                  id="yearTo"
                  placeholder="To (e.g. 2026)"
                  min="1800"
                  max="2026">
        </div>

        <!-- Rating Filter -->
        <div class="filter-group">
          <label>Minimum Rating</label>
          <div class="slider-container">
            <input type="range" min="1" max="5" step="0.5" value="1" oninput="this.nextElementSibling.value = this.value + ' ★'">
            <output>1 ★</output>
          </div>
        </div>

        <!-- Genres Custom Dropdown -->
        <div class="filter-group">
          <label>Genres</label>
          <details class="genre-dropdown">
            <summary class="dropdown-trigger">Select Genres</summary>
            <div class="dropdown-content">
              <input type="text" class="genre-search" placeholder="Search genres...">
              <button type="button" class="btn-clear-genres">Select All / Clear</button>
              
              <div class="genre-grid">
                <!-- 4 Placeholders (Will be dynamic with th:each from database) -->
                <label class="checkbox-label">
                  <input type="checkbox" name="genre" value="fantasy"> Fantasía Épica
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" name="genre" value="sci-fi"> Ciencia Ficción
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" name="genre" value="mystery"> Distopía
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" name="genre" value="romance"> Realismo Mágico
                </label>
              </div>
            </div>
          </details>
        </div>

        <!-- Reset Button -->
        <button type="reset" class="btn-reset-filters">Clean All Filters</button>
      </form>
    </aside>

    <!-- Main Content Area -->
    <main class="explore-content">
      <!-- Top Search Bar -->
      <div class="explore-search">
          <span class="search-icon">🔍</span>

          <input type="search"
                id="bookSearch"
                name="q"
                placeholder="Search titles, authors..."
                th:value="${param.q}"
                autocomplete="off"
                aria-label="Search books">
      </div>

      <p id="searchResults" class="search-results" aria-live="polite"></p>


        <!-- Books Grid -->
      
        <div class="books-grid">

            <div class="book-card"
                th:each="libro : ${libros}"
                th:data-title="${libro.titulo}"
                th:data-author="${libro.autor}"
                th:data-year="${libro.anio}"
                th:data-genre="${libro.genero}"
                tabindex="0">

                <div class="book-cover-wrapper">

                    <img th:src="${#strings.isEmpty(libro.portadaUrl)
                              ? '/images/book/Default_fallback.jpg'
                              : libro.portadaUrl}"
                          th:alt="${libro.titulo}"
                          class="book-cover">

                    <div class="book-popover">

                        <h4 class="popover-title"
                            th:text="${libro.titulo}">
                            Book title
                        </h4>

                        <p th:text="${libro.autor}">
                            Author
                        </p>

                        <p class="popover-synopsis"
                        th:text="${libro.sinopsis}">
                            Book synopsis
                        </p>

                        <a th:href="@{/libro/{id}(id=${libro.id})}"
                        class="btn-primary">
                            View details
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>
  </div>

  <!-- Bottom Navigation Fragment / Markup -->
  <nav class="bottom-nav">
    <a th:href="@{/}" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </a>
    <a th:href="@{/library}" class="nav-item">
      <span class="nav-icon">📚</span>
      <span>Library</span>
    </a>
    <a th:href="@{/explorar}" class="nav-item active">
      <span class="nav-icon">🚀</span>
      <span>Explore</span>
    </a>
    <a th:href="@{/search}" class="nav-item">
      <span class="nav-icon">🔍</span>
      <span>Search</span>
    </a>
  </nav>

  <!-- Footer Fragment -->
  <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
