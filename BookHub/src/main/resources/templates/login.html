
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(
    'Login | BookHub',
    'Login to your BookHub account.'
)}">
</head>
<body>

    <main class="auth-container">

        <div class="auth-card">

            <!-- Branding -->
            <a th:href="@{/}" class="auth-logo">
                <div class="logo-placeholder">📖</div>
                <span class="brand-name">Bookhub</span>
            </a>

            <!-- Heading -->
            <div class="auth-heading">
                <h1>Welcome back!</h1>
                <p>Sign in to continue your reading journey.</p>
            </div>

            <!-- Error message -->
            <div class="auth-alert" th:if="${param.error}">
                Invalid username/email or password. Please try again.
            </div>

            <div class="auth-alert success" th:if="${param.logout}">
                You have successfully logged out.
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post" class="auth-form">

                <input type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}">

                <div class="auth-field">
                    <label for="identifier">Username or Email</label>

                    <input type="text"
                        id="identifier"
                        name="identifier"
                        placeholder="Enter your username or email"
                        autocomplete="username"
                        required>
                </div>

                <div class="auth-field">
                    <label for="password">Password</label>

                    <input type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>

                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember-me">
                        Remember me
                    </label>

                    <a th:href="@{/forgot-password}">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="btn-primary auth-submit">
                    Sign In
                </button>

            </form>

            <!-- Registration Link -->
            <div class="auth-footer">
                <p>
                    Don't have an account?
                    <a th:href="@{/register}">Create one</a>
                </p>
            </div>

            <a th:href="@{/}" class="auth-back">
                ← Back to home
            </a>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
