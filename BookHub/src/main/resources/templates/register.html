
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(
    'Register | BookHub',
    'Create your BookHub account and start your reading journey.'
)}">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <!-- Branding -->
            <a th:href="@{/}" class="auth-logo">
                <div class="logo-placeholder">📖</div>
                <span class="brand-name">Bookhub</span>
            </a>

            <!-- Heading -->
            <div class="auth-heading">
                <h1>Join BookHub!</h1>
                <p>Create your account and start your reading journey.</p>
            </div>

            <!-- Error -->
            <div class="auth-alert"
                 th:if="${error}"
                 th:text="${error}">
            </div>

            <!-- Registration Form -->
            <form th:action="@{/api/users/register}"
                method="post"
                class="auth-form"
                id="registerForm">

                <!-- CSRF protection -->
                <input type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}">

                <!-- Full name -->
                <div class="auth-field">
                    <label for="nombre">Full name</label>
                    <input type="text"
                        id="nombre"
                        name="nombre"
                        required>
                </div>

                <!-- Username -->
                <div class="auth-field">
                    <label for="username">Username</label>
                    <input type="text"
                        id="username"
                        name="username"
                        required>
                </div>

                <!-- Email -->
                <div class="auth-field">
                    <label for="email">Email address</label>
                    <input type="email"
                        id="email"
                        name="email"
                        required>
                </div>

                <!-- Password -->
                <div class="auth-field">
                    <label for="password">Password</label>
                    <input type="password"
                        id="password"
                        name="password"
                        minlength="8"
                        required>
                </div>

                <!-- Confirm password -->
                <div class="auth-field">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        minlength="8"
                        required>
                </div>

                <button type="submit" class="btn-primary auth-submit">
                    Create Account
                </button>

            </form>

            <!-- Login Link -->
            <div class="auth-footer">
                <p>
                    Already have an account?
                    <a th:href="@{/login}">Sign in</a>
                </p>
            </div>

            <a th:href="@{/}" class="auth-back">
                ← Back to home
            </a>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/register.js}"></script>

</body>
</html>
