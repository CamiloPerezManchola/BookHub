spring.application.name=BookHub

# DB MySQL

spring.datasource.url=jdbc:mysql://localhost:3306/Bookhub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true

# Configuracion de vistas
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

spring.thymeleaf.cache=false

# Spring Security debugging
logging.level.org.springframework.security=TRACE

# MVC request mapping debugging
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false


# SSL / HTTPS CONFIGURATION

# Enable HTTPS
server.ssl.enabled=true

# HTTPS port
server.port=8443

# KeyStore configuration
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:bookhub-server.p12

# KeyStore password
server.ssl.key-store-password=ksokk102

# Private key alias
server.ssl.key-alias=bookhub-server

# SSL protocol
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
