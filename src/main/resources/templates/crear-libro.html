<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">

<head th:replace="~{fragments/head :: head(
    'Publish a Book | BookHub',
    'Share your book with the BookHub community.'
)}">
</head>

<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container create-book-container">

        <div class="create-book-header">

            <a th:href="@{/explorar}"
               class="btn-back"
               th:text="#{createBook.back}">
                ← Back to Explore
            </a>

            <h1 th:text="#{createBook.title}">
                Publish a Book
            </h1>

            <p th:text="#{createBook.subtitle}">
                Share your favorite books with the BookHub community.
            </p>

        </div>

        <section class="create-book-card">

            <form id="createBookForm"
                novalidate
                  th:data-chapter-label="#{createBook.chapter}"
                  th:data-chapter-label-plural="#{createBook.chapters}"
                  th:data-chapter-title="#{createBook.chapterTitle}"
                  th:data-chapter-title-placeholder="#{createBook.chapterTitlePlaceholder}"
                  th:data-chapter-content="#{createBook.chapterContent}"
                  th:data-chapter-content-placeholder="#{createBook.chapterContentPlaceholder}"
                  th:data-remove="#{createBook.remove}"
                  th:data-required="#{createBook.js.required}"
                  th:data-invalid-url="#{createBook.js.invalidUrl}"
                  th:data-invalid-year="#{createBook.js.invalidYear}"
                  th:data-invalid-genre="#{createBook.js.invalidGenre}"
                  th:data-invalid-chapter="#{createBook.js.invalidChapter}"
                  th:data-publishing="#{createBook.js.publishing}"
                  th:data-publish="#{createBook.js.publish}"
                  th:data-publish-success="#{createBook.js.publishSuccess}"
                  th:data-publish-error="#{createBook.js.publishError}">

                <!-- CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"
                       id="csrfToken">

                <input type="hidden"
                       th:value="${_csrf.headerName}"
                       id="csrfHeader">

                <!-- Title -->
                <div class="form-group">

                    <label for="titulo"
                           th:text="#{createBook.bookTitle}">
                        Book Title
                    </label>

                    <input type="text"
                           id="titulo"
                           maxlength="255"
                           th:placeholder="#{createBook.bookTitlePlaceholder}"
                           required>

                </div>

                <!-- Author -->
                <div class="form-group">

                    <label for="autor"
                           th:text="#{createBook.author}">
                        Author
                    </label>

                    <input type="text"
                           id="autor"
                           th:placeholder="#{createBook.authorPlaceholder}"
                           required>

                </div>

                <!-- Cover URL -->
                <div class="form-group">

                    <label for="portadaUrl"
                           th:text="#{createBook.coverUrl}">
                        Book Cover URL
                    </label>

                    <input type="url"
                           id="portadaUrl"
                           th:placeholder="#{createBook.coverPlaceholder}">

                </div>

                <!-- Year and Genre -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="anio"
                               th:text="#{createBook.year}">
                            Publication Year
                        </label>

                        <input type="number"
                               id="anio"
                               min="0"
                               max="2026"
                               placeholder="2020"
                               required>

                    </div>

                    <div class="form-group">

                        <label for="genero"
                               th:text="#{createBook.genre}">
                            Genre
                        </label>

                        <select id="genero" required>

                            <option value=""
                                    th:text="#{createBook.genre.select}">
                                Select a genre
                            </option>

                            <option value="Fantasy"
                                    th:text="#{createBook.genre.fantasy}">
                                Fantasy
                            </option>

                            <option value="Science Fiction"
                                    th:text="#{createBook.genre.scifi}">
                                Science Fiction
                            </option>

                            <option value="Romance"
                                    th:text="#{createBook.genre.romance}">
                                Romance
                            </option>

                            <option value="Mystery"
                                    th:text="#{createBook.genre.mystery}">
                                Mystery
                            </option>

                            <option value="Horror"
                                    th:text="#{createBook.genre.horror}">
                                Horror
                            </option>

                            <option value="Drama"
                                    th:text="#{createBook.genre.drama}">
                                Drama
                            </option>

                            <option value="Adventure"
                                    th:text="#{createBook.genre.adventure}">
                                Adventure
                            </option>

                            <option value="Biography"
                                    th:text="#{createBook.genre.biography}">
                                Biography
                            </option>

                            <option value="History"
                                    th:text="#{createBook.genre.history}">
                                History
                            </option>

                            <option value="Other"
                                    th:text="#{createBook.genre.other}">
                                Other
                            </option>

                        </select>

                    </div>

                </div>

                <!-- Synopsis -->
                <div class="form-group">

                    <label for="sinopsis"
                           th:text="#{createBook.synopsis}">
                        Synopsis
                    </label>

                    <textarea id="sinopsis"
                              rows="6"
                              th:placeholder="#{createBook.synopsisPlaceholder}"
                              required></textarea>

                </div>

                <!-- Chapters -->
                <section class="chapter-editor">

                    <div class="chapter-editor-heading">

                        <div>
                            <h3 th:text="#{createBook.chaptersTitle}">
                                Book Chapters
                            </h3>

                            <p th:text="#{createBook.chaptersDescription}">
                                Add the chapters readers will explore.
                            </p>
                        </div>

                        <button type="button"
                                id="addChapterBtn"
                                class="btn-secondary"
                                th:text="#{createBook.addChapter}">
                            + Add Chapter
                        </button>

                    </div>

                    <div id="chaptersContainer">

                        <div class="chapter-form-card" data-chapter>

                            <div class="chapter-form-heading">

                                <h4>Chapter 1</h4>

                                <button type="button"
                                        class="remove-chapter-btn"
                                        disabled
                                        th:text="#{createBook.remove}">
                                    Remove
                                </button>

                            </div>

                            <div class="form-group">

                                <label th:text="#{createBook.chapterTitle}">
                                    Chapter Title
                                </label>

                                <input type="text"
                                       class="chapter-title"
                                       maxlength="200"
                                       th:placeholder="#{createBook.chapterTitlePlaceholder}"
                                       required>

                            </div>

                            <div class="form-group">

                                <label th:text="#{createBook.chapterContent}">
                                    Chapter Content
                                </label>

                                <textarea class="chapter-content"
                                          rows="8"
                                          th:placeholder="#{createBook.chapterContentPlaceholder}"
                                          required></textarea>

                            </div>

                        </div>

                    </div>

                    <p id="chapterCount"></p>

                </section>

                <!-- Response message -->
                <p id="bookMessage"
                   role="status"
                   aria-live="polite">
                </p>

                <button type="submit"
                        id="publishBookBtn"
                        class="btn-primary"
                        th:text="#{createBook.publish}">
                    Publish Book
                </button>

            </form>

        </section>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:src="@{/js/crear-libro.js}" defer></script>

</body>
</html>
