<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">

<head th:replace="~{fragments/head :: head(
    #{error.page.title},
    #{error.page.description}
)}">
</head>

<body>

    <main class="error-container">

        <div class="error-content">

            <!-- Branding -->
            <a th:href="@{/}" class="auth-logo">
                <div class="logo-placeholder">📖</div>
                <span class="brand-name">Bookhub</span>
            </a>

            <!-- Error Illustration -->
            <div class="error-illustration">
                📚
            </div>

            <!-- Error Information -->
            <span class="error-code"
                  th:text="${status != null ? status : 404}">
                404
            </span>

            <h1 th:text="${status == 404
                ? #{error.notFound.title}
                : #{error.generic.title}}">
                Page not found
            </h1>

            <p class="error-description"
               th:text="${message != null
                ? message
                : (status == 404
                    ? #{error.notFound.description}
                    : #{error.generic.description})}">
                The page you are looking for does not exist
                or may have been moved.
            </p>

            <!-- Actions -->
            <div class="error-actions">

                <a th:href="@{/}"
                   class="btn-primary"
                   th:text="#{error.action.home}">
                    Go to homepage
                </a>

                <button type="button"
                        class="btn-error-secondary"
                        onclick="history.back()"
                        th:text="#{error.action.back}">
                    Go back
                </button>

            </div>

            <p class="error-footer"
               th:text="#{error.footer}">
                Need help? We're always happy to help fellow readers.
            </p>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
