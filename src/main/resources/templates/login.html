<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(
    'Login | BookHub',
    'Login to your BookHub account.'
)}">
</head>
<body>

    <main class="auth-container">

        <div class="auth-card">

            <!-- Branding -->
            <a th:href="@{/}" class="auth-logo">
                <div class="logo-placeholder">📖</div>
                <span class="brand-name">Bookhub</span>
            </a>

            <!-- Heading -->
            <div class="auth-heading">
                <h1 th:text="#{login.title}">
                    Welcome back!
                </h1>

                <p th:text="#{login.subtitle}">
                    Sign in to continue your reading journey.
                </p>
            </div>

            <!-- Error message -->
            <div class="auth-alert" th:if="${param.error}"
                 th:text="#{login.error}">
                Invalid username/email or password. Please try again.
            </div>

            <div class="auth-alert success" th:if="${param.logout}"
                 th:text="#{login.logout}">
                You have successfully logged out.
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post" class="auth-form">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="auth-field">

                    <label for="identifier"
                           th:text="#{login.identifier.label}">
                        Username or Email
                    </label>

                    <input type="text"
                           id="identifier"
                           name="identifier"
                           th:placeholder="#{login.identifier.placeholder}"
                           autocomplete="username"
                           required>
                </div>

                <div class="auth-field">

                    <label for="password"
                           th:text="#{login.password.label}">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           th:placeholder="#{login.password.placeholder}"
                           autocomplete="current-password"
                           required>
                </div>

                <button type="submit"
                        class="btn-primary auth-submit"
                        th:text="#{login.submit}">
                    Sign In
                </button>

            </form>

            <!-- Registration Link -->
            <div class="auth-footer">
                <p>
                    <span th:text="#{login.noAccount}">
                        Don't have an account?
                    </span>

                    <a th:href="@{/register}"
                       th:text="#{login.createAccount}">
                        Create one
                    </a>
                </p>
            </div>

            <a th:href="@{/}"
               class="auth-back"
               th:text="#{login.backHome}">
                ← Back to home
            </a>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
