<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(
    'Edit Profile | BookHub',
    'Manage your BookHub profile.'
)}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container profile-edit-container">

    <section class="profile-edit-card">

        <div class="profile-edit-heading">

            <span>YOUR ACCOUNT</span>

            <h1>Edit Profile</h1>

            <p>Make your BookHub profile yours.</p>

        </div>

        <!-- Success message -->
        <div th:if="${successMessage}"
             class="success-message"
             role="status"
             th:text="${successMessage}">
        </div>

        <form th:action="@{/perfil/editar}"
              th:object="${profileRequest}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <!-- Profile picture -->
            <div class="profile-image-preview">

                <img id="profilePreview"
                     th:src="${perfil.fotoPerfilUrl != null
                         and !#strings.isEmpty(perfil.fotoPerfilUrl)
                         ? perfil.fotoPerfilUrl
                         : '/images/default-avatar.png'}"
                     alt="Profile picture">

            </div>

            <div class="auth-field">

                <label for="fotoPerfilUrl">
                    Profile Picture URL
                </label>

                <input type="url"
                       id="fotoPerfilUrl"
                       th:field="*{fotoPerfilUrl}"
                       placeholder="https://example.com/avatar.jpg">

                <small class="field-error"
                       th:errors="*{fotoPerfilUrl}">
                </small>

            </div>

            <!-- Name -->
            <div class="auth-field">

                <label for="nombre">Display Name</label>

                <input type="text"
                       id="nombre"
                       th:field="*{nombre}"
                       maxlength="100"
                       required>

                <small class="field-error"
                       th:errors="*{nombre}">
                </small>

            </div>

            <!-- Email (read only) -->
            <div class="auth-field">

                <label for="email">Email</label>

                <input type="email"
                       id="email"
                       th:value="${perfil.email}"
                       readonly>

                <small>Email cannot be changed here.</small>

            </div>

            <!-- Description -->
            <div class="auth-field">

                <label for="descripcion">About Me</label>

                <textarea id="descripcion"
                          th:field="*{descripcion}"
                          rows="4"
                          maxlength="500"
                          placeholder="Tell the community something about yourself...">
                </textarea>

                <small class="field-error"
                       th:errors="*{descripcion}">
                </small>

            </div>

            <div class="profile-edit-actions">

                <button type="submit" class="btn-primary">
                    Save Changes
                </button>

                <a th:href="@{/mibiblioteca}"
                   class="btn-cancel">
                    Cancel
                </a>

            </div>

        </form>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
document.addEventListener("DOMContentLoaded", function() {

    const input = document.getElementById("fotoPerfilUrl");
    const preview = document.getElementById("profilePreview");

    input.addEventListener("input", function() {

        preview.src = this.value.trim()
            || "/images/default-avatar.png";

    });

    preview.addEventListener("error", function() {
        this.src = "/images/default-avatar.png";
    });

});
</script>

</body>
</html>
