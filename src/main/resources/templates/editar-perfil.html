<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">

<head th:replace="~{fragments/head :: head(
    'Edit Profile | BookHub',
    'Manage your BookHub profile.'
)}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container profile-edit-container">

    <section class="profile-edit-card">

        <div class="profile-edit-heading">

            <span th:text="#{profile.edit.eyebrow}">
                YOUR ACCOUNT
            </span>

            <h1 th:text="#{profile.edit.title}">
                Edit Profile
            </h1>

            <p th:text="#{profile.edit.subtitle}">
                Make your BookHub profile yours.
            </p>

        </div>

        <!-- Success message -->
        <div th:if="${successMessage}"
             class="success-message"
             role="status"
             th:text="${successMessage}">
        </div>

        <form th:action="@{/perfil/editar}"
              th:object="${profileRequest}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <!-- Profile picture -->
            <div class="profile-image-preview">

                <img id="profilePreview"
                     th:src="${perfil.fotoPerfilUrl != null
                         and !#strings.isEmpty(perfil.fotoPerfilUrl)
                         ? perfil.fotoPerfilUrl
                         : '/images/default-avatar.png'}"
                     th:alt="#{profile.edit.imageAlt}">

            </div>

            <!-- Profile picture URL -->
            <div class="auth-field">

                <label for="fotoPerfilUrl"
                       th:text="#{profile.edit.photoUrl}">
                    Profile Picture URL
                </label>

                <input type="url"
                       id="fotoPerfilUrl"
                       th:field="*{fotoPerfilUrl}"
                       th:placeholder="#{profile.edit.photoPlaceholder}">

                <small class="field-error"
                       th:errors="*{fotoPerfilUrl}">
                </small>

            </div>

            <!-- Name -->
            <div class="auth-field">

                <label for="nombre"
                       th:text="#{profile.edit.name}">
                    Display Name
                </label>

                <input type="text"
                       id="nombre"
                       th:field="*{nombre}"
                       maxlength="100"
                       required>

                <small class="field-error"
                       th:errors="*{nombre}">
                </small>

            </div>

            <!-- Email (read only) -->
            <div class="auth-field">

                <label for="email"
                       th:text="#{profile.edit.email}">
                    Email
                </label>

                <input type="email"
                       id="email"
                       th:value="${perfil.email}"
                       readonly>

                <small th:text="#{profile.edit.emailHelp}">
                    Email cannot be changed here.
                </small>

            </div>

            <!-- Description -->
            <div class="auth-field">

                <label for="descripcion"
                       th:text="#{profile.edit.about}">
                    About Me
                </label>

                <textarea id="descripcion"
                          th:field="*{descripcion}"
                          rows="4"
                          maxlength="500"
                          th:placeholder="#{profile.edit.aboutPlaceholder}">
                </textarea>

                <small class="field-error"
                       th:errors="*{descripcion}">
                </small>

            </div>

            <!-- Actions -->
            <div class="profile-edit-actions">

                <button type="submit"
                        class="btn-primary"
                        th:text="#{profile.edit.save}">
                    Save Changes
                </button>

                <a th:href="@{/mibiblioteca}"
                   class="btn-cancel"
                   th:text="#{profile.edit.cancel}">
                    Cancel
                </a>

            </div>

        </form>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
document.addEventListener("DOMContentLoaded", function() {

    const input = document.getElementById("fotoPerfilUrl");
    const preview = document.getElementById("profilePreview");

    input.addEventListener("input", function() {

        preview.src = this.value.trim()
            || "/images/default-avatar.png";

    });

    preview.addEventListener("error", function() {
        this.src = "/images/default-avatar.png";
    });

});
</script>

</body>
</html>
