<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title, description)">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="_csrf"
      th:content="${_csrf.token}">

    <meta name="_csrf_header"
      th:content="${_csrf.headerName}">

    <!-- Dynamic SEO metadata -->
    <title th:text="${title}">BookHub</title>

    <meta name="description"
          th:content="${description != null ? description : 'BookHub - Discover, track and share books.'}">

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom styles -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <!-- Global JavaScript -->
    <script th:src="@{/js/global.js}" defer></script>

</head>
</html>
