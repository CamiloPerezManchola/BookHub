<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header" class="top-bar">

    <!-- Brand -->
    <a th:href="@{/}" class="logo-container text-decoration-none">
        <div class="logo-placeholder">📖</div>
        <span class="brand-name">Bookhub</span>
    </a>

    <div class="header-right">

        <!-- Search -->
        <form th:action="@{/explorar}"
              method="get"
              class="search-box">

            <span class="search-icon">🔍</span>

            <input type="search"
                   name="q"
                   th:placeholder="#{header.search}"
                   th:attr="aria-label=#{header.search}"
                   placeholder="Buscar libros...">

            <span class="kbd-shortcut">➤</span>
        </form>

        <!-- Language selector -->
        <div class="language-selector">

            <select id="languageSelect"
                    aria-label="Select language">

                <option value="es"
                        th:selected="${#locale.language == 'es'}">
                    🇪🇸 Español
                </option>

                <option value="en"
                        th:selected="${#locale.language == 'en'}">
                    🇬🇧 English
                </option>

                <option value="it"
                        th:selected="${#locale.language == 'it'}">
                    🇮🇹 Italiano
                </option>

            </select>

        </div>

        <!-- Logged out -->
        <a th:if="${currentUser == null}"
           th:href="@{/login}"
           class="btn-login"
           th:text="#{nav.login}">
            Iniciar sesión
        </a>

        <!-- Logged in -->
        <details th:if="${currentUser != null}"
                 class="profile-dropdown">

            <summary class="profile-trigger">

                <img th:if="${currentUser.fotoPerfilUrl != null
                             and !#strings.isEmpty(currentUser.fotoPerfilUrl)}"
                     th:src="${currentUser.fotoPerfilUrl}"
                     alt="Profile picture"
                     class="header-avatar">

                <div th:unless="${currentUser.fotoPerfilUrl != null
                                 and !#strings.isEmpty(currentUser.fotoPerfilUrl)}"
                     class="header-avatar avatar-placeholder">
                    👤
                </div>

                <span class="header-username"
                      th:text="${currentUser.nombre}">
                    User
                </span>

                <span class="profile-arrow">⌄</span>

            </summary>

            <div class="profile-menu">

                <a th:href="@{/mibiblioteca}">
                    <span>📚</span>
                    <span th:text="#{nav.library}">Mi biblioteca</span>
                </a>

                <a th:href="@{/estadisticas}">
                    <span>📊</span>
                    <span th:text="#{nav.statistics}">Estadísticas</span>
                </a>

                <a th:href="@{/perfil/editar}">
                    <span>✏️</span>
                    <span th:text="#{nav.editProfile}">Editar perfil</span>
                </a>

                <a th:href="@{/crear-libro}"
                   class="btn-primary">
                    + <span th:text="#{nav.publishBook}">Publicar un libro</span>
                </a>

                <div class="profile-menu-divider"></div>

                <form th:action="@{/logout}" method="post">

                    <button type="submit" class="logout-option">
                        <span>↪</span>
                        <span th:text="#{nav.logout}">Cerrar sesión</span>
                    </button>

                </form>

            </div>

        </details>

    </div>

</header>

</body>
</html>
