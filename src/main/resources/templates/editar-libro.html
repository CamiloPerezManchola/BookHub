<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">

<head th:replace="~{fragments/head :: head(
    #{editBook.page.title},
    #{editBook.page.description}
)}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container book-edit-container">

    <section class="book-edit-card">

        <div class="book-edit-heading">

            <span th:text="#{editBook.eyebrow}">
                BOOK MANAGEMENT
            </span>

            <h1 th:text="#{editBook.title}">
                Edit Book ✏️
            </h1>

            <p th:text="#{editBook.subtitle}">
                Keep your book information up to date.
            </p>

        </div>

        <form th:action="@{/libro/{id}/editar(id=${libro.id})}"
              th:object="${bookRequest}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <!-- Cover preview -->
            <div class="book-edit-preview">

                <img id="coverPreview"
                     th:src="${libro.portadaUrl != null
                         and !#strings.isEmpty(libro.portadaUrl)
                         ? libro.portadaUrl
                         : '/images/book/Default_fallback.jpg'}"
                     th:alt="#{editBook.coverAlt}">

            </div>

            <!-- Title -->
            <div class="auth-field">

                <label for="titulo"
                       th:text="#{editBook.bookTitle}">
                    Book Title
                </label>

                <input type="text"
                       id="titulo"
                       th:field="*{titulo}"
                       required>

                <small class="field-error"
                       th:errors="*{titulo}">
                </small>

            </div>

            <!-- Author -->
            <div class="auth-field">

                <label for="autor"
                       th:text="#{editBook.author}">
                    Author
                </label>

                <input type="text"
                       id="autor"
                       th:field="*{autor}"
                       required>

                <small class="field-error"
                       th:errors="*{autor}">
                </small>

            </div>

            <!-- Cover URL -->
            <div class="auth-field">

                <label for="portadaUrl"
                       th:text="#{editBook.coverUrl}">
                    Cover URL
                </label>

                <input type="url"
                       id="portadaUrl"
                       th:field="*{portadaUrl}"
                       th:placeholder="#{editBook.coverPlaceholder}">

                <small class="field-error"
                       th:errors="*{portadaUrl}">
                </small>

            </div>

            <!-- Year -->
            <div class="auth-field">

                <label for="anio"
                       th:text="#{editBook.year}">
                    Publication Year
                </label>

                <input type="number"
                       id="anio"
                       th:field="*{anio}"
                       min="0"
                       max="2026"
                       required>

                <small class="field-error"
                       th:errors="*{anio}">
                </small>

            </div>

            <!-- Genre -->
            <div class="auth-field">

                <label for="genero"
                       th:text="#{editBook.genre}">
                    Genre
                </label>

                <input type="text"
                       id="genero"
                       th:field="*{genero}"
                       th:placeholder="#{editBook.genrePlaceholder}"
                       required>

                <small class="field-error"
                       th:errors="*{genero}">
                </small>

            </div>

            <!-- Synopsis -->
            <div class="auth-field">

                <label for="sinopsis"
                       th:text="#{editBook.synopsis}">
                    Synopsis
                </label>

                <textarea id="sinopsis"
                          th:field="*{sinopsis}"
                          rows="6"
                          required>
                </textarea>

                <small class="field-error"
                       th:errors="*{sinopsis}">
                </small>

            </div>

            <!-- Actions -->
            <div class="book-edit-actions">

                <button type="submit"
                        class="btn-primary"
                        th:text="#{editBook.save}">
                    Save Changes
                </button>

                <a th:href="@{/libro/{id}(id=${libro.id})}"
                   class="btn-cancel"
                   th:text="#{editBook.cancel}">
                    Cancel
                </a>

            </div>

        </form>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
document.addEventListener("DOMContentLoaded", function() {

    const input = document.getElementById("portadaUrl");
    const preview = document.getElementById("coverPreview");

    input.addEventListener("input", function() {

        preview.src = this.value.trim()
            || "/images/book/Default_fallback.jpg";

    });

    preview.addEventListener("error", function() {

        this.src = "/images/book/Default_fallback.jpg";

    });

});
</script>

</body>
</html>
