<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(
    'Explore Books | BookHub',
    'Explore books, authors and recommendations.'
)}">
</head>
<body>

  <!-- Header Fragment -->
  <div th:replace="~{fragments/header :: header}"></div>

  <div class="explore-layout container">
    <!-- Sidebar / Top Filter Bar on Mobile -->
    <aside class="filter-sidebar">
      <div class="filter-header">
        <h2>Filters</h2>
      </div>

      <form id="filterForm" class="filter-form">
        <!-- Publication Year Filter -->
        <div class="range-inputs">

          <input type="number"
                id="yearFrom"
                placeholder="From"
                min="1800"
                th:attr="max=${maxYear}">

          <span>to</span>

          <input type="number"
                id="yearTo"
                placeholder="To"
                th:attr="min=${minYear},max=${maxYear}">

        </div>

        <p class="filter-hint">
            Available years:
            <span th:text="${minYear}">1800</span>
            -
            <span th:text="${maxYear}">2026</span>
        </p>

        <!-- Rating Filter -->
        <div class="filter-group">

            <label for="minimumRating">
                Minimum Rating
            </label>

            <div class="slider-container">

                <input type="range"
                      id="minimumRating"
                      min="0"
                      max="5"
                      step="0.5"
                      value="0">

                <output id="ratingOutput">
                    Any rating
                </output>

            </div>

        </div>

        <!-- Genres Custom Dropdown -->
        <div class="filter-group">
          <label>Genres</label>
          <details class="genre-dropdown">
            <summary class="dropdown-trigger">Select Genres</summary>
            <div class="dropdown-content">
              <input type="text" class="genre-search" placeholder="Search genres...">
              <button type="button" class="btn-clear-genres">Select All / Clear</button>
              <div class="genre-grid">

                <label class="checkbox-label"
                      th:each="genero : ${generos}">

                    <input type="checkbox"
                          name="genre"
                          th:value="${genero}">

                    <span th:text="${genero}">
                        Genre
                    </span>

                </label>

                <p th:if="${generos.isEmpty()}">
                    No genres available.
                </p>

              </div>
            </div>
          </details>
        </div>

        <!-- Reset Button -->
        <button type="reset" class="btn-reset-filters">Clean All Filters</button>
      </form>
    </aside>

    <!-- Main Content Area -->
    <main class="explore-content">
      <!-- Top Search Bar -->
      <div class="explore-search">
          <span class="search-icon">🔍</span>

          <input type="search"
                id="bookSearch"
                name="q"
                placeholder="Search titles, authors..."
                th:value="${param.q}"
                autocomplete="off"
                aria-label="Search books">
      </div>

      <p id="searchResults" class="search-results" aria-live="polite"></p>


        <!-- Books Grid -->

        <div class="books-grid"
            id="booksGrid">

            <div class="book-card"
                th:each="libro : ${libros}"

                th:data-title="${libro.titulo}"
                th:data-author="${libro.autor}"
                th:data-year="${libro.anio}"
                th:data-genre="${libro.genero}"

                th:data-rating="${ratingByBook[libro.id] ?: 0}"

                tabindex="0">

                <!-- Book Cover -->
                <div class="book-cover-wrapper">

                    <img th:src="${#strings.isEmpty(libro.portadaUrl)
                                ? '/images/book/Default_fallback.jpg'
                                : libro.portadaUrl}"
                        th:alt="${libro.titulo}"
                        class="book-cover">

                    <!-- Hover Information -->
                    <div class="book-popover">

                        <h4 class="popover-title"
                            th:text="${libro.titulo}">
                            Book title
                        </h4>

                        <p class="popover-author"
                          th:text="${libro.autor}">
                            Author
                        </p>

                        <div class="popover-rating">

                            <span>⭐</span>

                            <strong th:text="${
                                ratingByBook[libro.id] != null
                                ? #numbers.formatDecimal(ratingByBook[libro.id], 1, 1)
                                : 'No ratings'
                            }">
                                No ratings
                            </strong>

                        </div>

                        <p class="popover-synopsis"
                          th:text="${libro.sinopsis}">
                            Book synopsis
                        </p>

                        <a th:href="@{/libro/{id}(id=${libro.id})}"
                          class="btn-primary">
                            View details
                        </a>

                    </div>

                </div>

            </div>

        </div>

        <!-- No Results -->
        <div id="noBooksMessage"
            class="no-books-message"
            hidden>

            <span>📚</span>

            <h3>No books found</h3>

            <p>
                Try changing your search or filters.
            </p>

        </div>

    </main>
  </div>

  <!-- Bottom Navigation Fragment / Markup -->
  <nav class="bottom-nav">
    <a th:href="@{/}" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </a>
    <a th:href="@{/library}" class="nav-item">
      <span class="nav-icon">📚</span>
      <span>Library</span>
    </a>
    <a th:href="@{/explorar}" class="nav-item active">
      <span class="nav-icon">🚀</span>
      <span>Explore</span>
    </a>
    <a th:href="@{/search}" class="nav-item">
      <span class="nav-icon">🔍</span>
      <span>Search</span>
    </a>
  </nav>

  <!-- Footer Fragment -->
  <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/explore.js}" defer></script>

</body>
</html>
